# Small implementation-only configuration for CPU shape/entry-point checks.
# It is not an experimental setting from the paper.
dataset:
  name: SMOKE
  root: data/smoke
  train_images: images/train
  val_images: images/test
  train_annotations: annotations/instances_train.json
  val_annotations: annotations/instances_test.json
  image_size: [64, 64]
  num_classes: 1
  category_ids: [1]
model:
  in_channels: 3
  num_classes: 1
  i_lta_channels: 4  # TODO: Not explicitly specified in the paper
  stage_dims: [8, 16, 32, 64]  # TODO: Not explicitly specified in the paper
  stage_heads: [1, 2, 4, 8]  # TODO: Not explicitly specified in the paper
  stage_depths: [1, 1, 1, 1]  # TODO: Not explicitly specified in the paper
  window_size: 4  # TODO: Not explicitly specified in the paper
  position_dim: 256
  num_superpixels: 8  # TODO: Not explicitly specified in the paper
  superpixel_compactness: 10.0  # TODO: Not explicitly specified in the paper
  superpixel_max_iter: 2  # TODO: Not explicitly specified in the paper
  sp_bandwidths: [1.0]  # TODO: Not explicitly specified in the paper
  fa_num_hyperedges: [4, 4, 2, 2]  # TODO: Not explicitly specified in the paper
  fa_heads: [1, 2, 4, 8]  # TODO: Not explicitly specified in the paper
  anchor_sizes: [8, 16]  # TODO: Not explicitly specified in the paper
  anchor_ratios: [0.5, 1.0, 2.0]  # TODO: Not explicitly specified in the paper
  proposal_pre_nms_topk: 40  # TODO: Not explicitly specified in the paper
  proposal_post_nms_topk: 10  # TODO: Not explicitly specified in the paper
  proposal_nms_threshold: 0.7  # TODO: Not explicitly specified in the paper
  proposal_iou_threshold: 0.5
  proposal_hypergraph_k: 2  # TODO: Not explicitly specified in the paper
  roi_output_size: 2  # TODO: Not explicitly specified in the paper
  num_queries: 10  # TODO: Not explicitly specified in the paper
  transformer_heads: 8  # TODO: Not explicitly specified in the paper
  encoder_layers: 1  # TODO: Not explicitly specified in the paper
  decoder_layers: 1  # TODO: Not explicitly specified in the paper
  ff_dim: 128  # TODO: Not explicitly specified in the paper
  dropout: 0.0  # TODO: Not explicitly specified in the paper
cdn_fd:
  lambda_1: 0.1
  lambda_2: 0.7
  gradient_iou_threshold: 0.3
  negative_threshold: 0.3
  lambda_reg: 1.0
  lambda_cls: 2.0
  lambda_neg: 0.5
  denoising_groups: 1  # TODO: Not explicitly specified in the paper
train:
  optimizer: SGD
  epochs: 320
  learning_rate: 0.04
  milestones: [280, 300]
  gamma: 0.1
  momentum: 0.99
  nesterov: true
  weight_decay: 0.005
  batch_size: 1
  num_workers: 0
  seed: 42
  output_dir: outputs/smoke
  log_interval: 1
  eval_interval: 1
test:
  batch_size: 1
  num_workers: 0
  score_threshold: 0.05  # TODO: Not explicitly specified in the paper
  max_detections: 10  # TODO: Not explicitly specified in the paper

